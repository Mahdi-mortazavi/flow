<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flow — تک‌نقطه">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      .glowing-ember {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: 250px 200px;
      }
      .pulsing-dot {
        animation: pulseDot 2.5s ease-in-out infinite;
        transform-origin: 250px 190px;
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0e"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EFA55C" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#EFA55C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#EFA55C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6C98A"/>
      <stop offset="1" stop-color="#E08E3E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>

  <!-- ambient ember glow, top-left where the boulder lives -->
  <circle class="glowing-ember" cx="250" cy="200" r="360" fill="url(#ember)"/>

  <!-- faint grid of glass cards, monochrome -->
  <g opacity="0.5">
    <rect x="60" y="300" width="150" height="90" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.05"/>
    <rect x="230" y="300" width="150" height="90" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.05"/>
    <rect x="400" y="300" width="150" height="90" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.05"/>
  </g>

  <!-- the boulder: one warm ring -->
  <g transform="translate(250,190)">
    <circle r="86" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="14"/>
    <circle r="86" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="405 540" transform="rotate(-90)"/>
    <circle class="pulsing-dot" r="9" fill="#EFA55C"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(470,140)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#F4F4F6" letter-spacing="-2">Flow</text>
    <text x="6" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="600" fill="#EFA55C" direction="rtl">تک‌نقطه</text>
    <text x="6" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#B8B8C0" direction="rtl">سیستم‌عاملِ تمرکز، انرژی و زمانِ تو</text>
    <text x="6" y="152" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#6E6E78">Personal focus OS &amp; habit tracker — 100% offline &amp; private.</text>
  </g>

  <!-- privacy chip -->
  <g transform="translate(1010,58)">
    <rect x="0" y="0" width="210" height="40" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="26" cy="20" r="5" fill="#4ade80"/>
    <text x="44" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#C9C9D1">100% offline · no server</text>
  </g>
</svg>
