<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="re-flow — Flow / تک‌نقطه">
  <defs>
    <style>
      @keyframes glowPulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes ringPulse {
        0%, 100% { stroke-opacity: 0.85; stroke-width: 10px; }
        50% { stroke-opacity: 1; stroke-width: 12px; }
      }
      @keyframes dotPulse {
        0%, 100% { r: 7px; opacity: 0.85; }
        50% { r: 9px; opacity: 1; }
      }
      .glow-bg {
        animation: glowPulse 4s ease-in-out infinite;
        transform-origin: 600px 105px;
      }
      .ring-arc {
        animation: ringPulse 3s ease-in-out infinite;
        transform-origin: 600px 105px;
      }
      .dot-center {
        animation: dotPulse 2s ease-in-out infinite;
      }
    </style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#09090E"/>
    </linearGradient>

    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#EFA55C" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#EFA55C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#EFA55C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6B26E"/>
      <stop offset="100%" stop-color="#E7994C"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" fill="none"/>

  <!-- Centered Ambient Glow -->
  <circle class="glow-bg" cx="600" cy="105" r="220" fill="url(#emberGlow)"/>

  <!-- Top Badges -->
  <g transform="translate(40, 30)">
    <rect width="180" height="34" rx="17" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#4ADE80"/>
    <text x="34" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F5F5F7">100% Offline</text>
  </g>

  <g transform="translate(980, 30)">
    <rect width="180" height="34" rx="17" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <text x="20" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#EFA55C">🎨</text>
    <text x="42" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F5F5F7">Liquid Glass</text>
  </g>

  <!-- Centered Icon (The Boulder Glass Ring) -->
  <g transform="translate(600, 105)">
    <circle r="52" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
    <circle r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="10"/>
    <circle class="ring-arc" r="40" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="190 260" transform="rotate(-90)"/>
    <circle class="dot-center" cx="0" cy="0" r="7" fill="#EFA55C"/>
  </g>

  <!-- Centered Branding & Typography (Zero Collision!) -->
  <g transform="translate(600, 205)">
    <!-- Main Title -->
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#F5F5F7" letter-spacing="-1.5">Flow</text>

    <!-- Persian Subtitle (Directly under Flow!) -->
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Vazirmatn', 'Tahoma', sans-serif" font-size="28" font-weight="700" fill="#EFA55C">تک‌نقطه</text>

    <!-- Tagline (Directly under تک‌نقطه!) -->
    <text x="0" y="82" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Vazirmatn', 'Tahoma', sans-serif" font-size="19" font-weight="500" fill="#A2ADC0">سیستم‌عاملِ تمرکز، انرژی و زمانِ تو</text>

    <!-- Secondary Tagline -->
    <text x="0" y="112" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#556070">Personal Focus &amp; Habit OS · 100% Offline &amp; Private · Dual Locale (EN / FA)</text>
  </g>
</svg>
