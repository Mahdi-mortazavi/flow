name: Release

# One version number drives everything: bump `version:` in pubspec.yaml, merge
# to main, and this pipeline tags the commit, builds and signs every APK,
# verifies each one, writes the release notes from the commit history, publishes
# the release, and points the README download block at it.
#
# Nothing here needs a hand-written changelog or a manually created tag.

on:
  push:
    branches: [main]
    paths: ['pubspec.yaml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.6.0 (default: the version in pubspec.yaml)'
        required: false
        type: string

permissions:
  contents: write

# Two releases must never build at once: they would race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.35.1
  # Every ABI a Flutter Android build can emit. The universal APK must contain
  # all of them; that is the copy users are told to install.
  EXPECTED_ABIS: 'arm64-v8a armeabi-v7a x86_64'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and decide whether to publish
        id: resolve
        env:
          # Through env, never inlined: workflow inputs are untrusted text.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT:-}"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)"
          fi
          VERSION="${VERSION#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a semantic version (expected MAJOR.MINOR.PATCH)."
            exit 1
          fi

          TAG="v$VERSION"
          PREVIOUS="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"

          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG already exists — nothing to publish. Bump pubspec.yaml to release."
            SHOULD=false
          else
            SHOULD=true
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "previous_tag=$PREVIOUS"
            echo "should_release=$SHOULD"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Previous tag | \`${PREVIOUS:-—}\` |"
            echo "| Will publish | \`$SHOULD\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Format · Analyze · Test
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build · Sign · Verify
    needs: [plan, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    outputs:
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # A release must carry the permanent production key. Failing here — before
      # anything is built or tagged — is far cheaper than discovering a
      # debug-signed APK after publishing it.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing signing secrets: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Two builds: --split-per-abi emits no universal APK, and the plain build
      # emits no per-ABI APKs. Each output is copied to dist/ immediately so the
      # second build cannot clobber the first.
      - name: Build universal APK
        run: |
          set -euo pipefail
          flutter build apk --release --build-name="$VERSION"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/taknoghte-${TAG}-universal.apk"

      - name: Build per-ABI APKs
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --build-name="$VERSION"
          for abi in $EXPECTED_ABIS; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/taknoghte-${TAG}-${abi}.apk"
          done

      - name: Verify integrity, manifest and signatures
        id: verify
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          fail=0
          cert=""

          for apk in dist/*.apk; do
            echo "::group::$apk"

            # 1. Structural integrity — a truncated zip is the classic
            #    "there was a problem parsing the package".
            unzip -t "$apk" > /dev/null || { echo "CORRUPT ZIP: $apk"; fail=1; }

            # 2. The manifest must be readable and report what we expect.
            badging="$("$BT/aapt" dump badging "$apk")"
            echo "$badging" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:|^application-label:"
            echo "$badging" | grep -q "sdkVersion:'24'" \
              || { echo "UNEXPECTED minSdk in $apk"; fail=1; }
            echo "$badging" | grep -q "versionName='${VERSION}'" \
              || { echo "VERSION NAME MISMATCH in $apk (expected ${VERSION})"; fail=1; }

            # 3. The universal APK must really carry every ABI, otherwise the
            #    "installs on every phone" promise is false.
            case "$apk" in
              *universal*)
                for abi in $EXPECTED_ABIS; do
                  echo "$badging" | grep -q "$abi" \
                    || { echo "UNIVERSAL APK MISSING ABI $abi"; fail=1; }
                done
                ;;
            esac

            # 4. The signature must verify with the production certificate.
            "$BT/apksigner" verify --verbose --print-certs "$apk" > sig.txt || {
              echo "SIGNATURE VERIFICATION FAILED: $apk"; fail=1; }
            grep -E "Verified using v(1|2|3) scheme|certificate DN" sig.txt || true

            if grep -q "CN=Android Debug" sig.txt; then
              # The CI debug keystore is regenerated on every run, so a
              # debug-signed release could never be updated in place.
              echo "REFUSING TO PUBLISH A DEBUG-SIGNED APK: $apk"
              fail=1
            else
              # v2 + v3 is the complete set at minSdk 24; v1 only matters below
              # API 24, which this app cannot run on.
              for scheme in "v2 scheme" "v3 scheme"; do
                grep -q "Verified using $scheme.*: true" sig.txt \
                  || { echo "MISSING SIGNATURE SCHEME: $scheme in $apk"; fail=1; }
              done
              # Matches both apksigner spellings: "Signer #1 certificate SHA-256
              # digest:" and the per-scheme "Signer (APK Signature Scheme vN) #1
              # certificate SHA-256 digest:".
              fp="$(sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F:]+).*/\1/p' sig.txt | head -1)"
              if [ -n "$fp" ]; then
                if [ -z "$cert" ]; then
                  cert="$fp"
                elif [ "$cert" != "$fp" ]; then
                  # All artifacts of one release must share one certificate.
                  echo "CERTIFICATE MISMATCH BETWEEN ARTIFACTS: $apk"
                  fail=1
                fi
              fi
            fi

            echo "::endgroup::"
          done

          rm -f sig.txt
          [ "$fail" -eq 0 ] || { echo "::error::APK verification failed."; exit 1; }
          if [ -z "$cert" ]; then
            echo "::warning::Could not read the signing certificate fingerprint; release notes will omit it."
          fi
          echo "cert_sha256=$cert" >> "$GITHUB_OUTPUT"
          echo "All APKs verified. Signing certificate SHA-256: ${cert:-unknown}"

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done
          cat ./*.sha256

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error

  publish:
    name: Tag & Publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      - name: Write release notes from the commit history
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py \
            --version "${{ needs.plan.outputs.version }}" \
            --tag "$TAG" \
            --previous-tag "${{ needs.plan.outputs.previous_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dist dist \
            --cert-sha256 "${{ needs.build.outputs.cert_sha256 }}" > release_body.md
          cat release_body.md >> "$GITHUB_STEP_SUMMARY"

      # Creates the tag at this commit and publishes the release with every
      # APK and checksum attached.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: تک‌نقطه ${{ env.TAG }}
          body_path: release_body.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: 'true'

  sync-docs:
    name: Sync README download links
    needs: [plan, publish]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      - name: Rewrite the README release block
        run: |
          set -euo pipefail
          python3 .github/scripts/update_readme.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --dist dist

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already points at $TAG."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: point download links at $TAG [skip ci]"
          git push
