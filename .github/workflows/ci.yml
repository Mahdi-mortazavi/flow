name: CI

# Fast feedback on every push and pull request. Publishing lives in
# release.yml; nothing here ever writes to the repository or creates a release.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.1

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

  build:
    name: Android build smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug-signed on purpose: this job proves the Gradle/Flutter build still
      # produces an installable APK. Signed, publishable artifacts are only
      # ever produced by release.yml, which refuses the debug certificate.
      - name: Build release APK
        run: flutter build apk --release

      - name: Inspect the APK
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -t "$APK" > /dev/null
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:"
          "$BT/apksigner" verify --verbose "$APK"

      - name: Upload APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
