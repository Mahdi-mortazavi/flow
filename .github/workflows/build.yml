name: Build APK (arm64-v8a)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run tests
        run: flutter test

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taknoghte-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "taknoghte-${{ github.ref_name }}-arm64-v8a.apk"
          sha256sum "taknoghte-${{ github.ref_name }}-arm64-v8a.apk" \
             > "taknoghte-${{ github.ref_name }}-arm64-v8a.apk.sha256"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 'تک‌نقطه ${{ github.ref_name }}'
          body_path: RELEASE_NOTES.md
          files: |
            taknoghte-${{ github.ref_name }}-arm64-v8a.apk
            taknoghte-${{ github.ref_name }}-arm64-v8a.apk.sha256
