name: taknoghte
description: "تک‌نقطه — سیستم مدیریت تمرکز، انرژی و زمان"
publish_to: 'none'
version: 0.4.1+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_riverpod: ^3.3.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shamsi_date: ^1.1.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  timezone: ^0.10.1
  share_plus: ^12.0.2
  file_picker: ^11.0.2
  android_intent_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.7+1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#060608"
  adaptive_icon_foreground: assets/icon/icon_fg.png

flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
